/* 扩展库公共构建、依赖解析与 IDE 模型导出。xhwsd@qq.com 2026-10-25 */
import org.gradle.maven.MavenModule
import org.gradle.maven.MavenPomArtifact
import org.gradle.api.artifacts.result.ResolvedArtifactResult
import simple.compiler.util.MavenRepository
import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import javax.inject.Inject
import org.gradle.api.component.SoftwareComponentFactory
import org.gradle.api.artifacts.ModuleDependency
import org.gradle.api.artifacts.ProjectDependency

/* 只发布原始模块声明；组件没有二进制制品，类库本体仍由 ES4A 目录格式交付。 */
class Es4aDependencyPublication implements Plugin<Project> {
	private final SoftwareComponentFactory factory

	@Inject
	Es4aDependencyPublication(SoftwareComponentFactory factory) {
		this.factory = factory
	}

	void apply(Project project) {
		project.components.add(factory.adhoc('es4aDependencies'))
	}
}
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.jvm.JvmLibrary
import org.gradle.language.base.artifact.SourcesArtifact

buildscript {
	def sdk = file(providers.gradleProperty('sdkDir').get())
	dependencies {
		classpath files(new File(sdk, 'simple/SimpleCompiler.jar'), fileTree(new File(sdk, 'simple/libs')) { include '*.jar' })
	}
}

apply plugin: 'com.android.library'
apply plugin: 'maven-publish'
apply plugin: Es4aDependencyPublication

def libraryRoot = file(providers.gradleProperty('libraryDir').get())
def sdkRoot = file(providers.gradleProperty('sdkDir').get())
buildDir = new File(libraryRoot, 'build/gradle/android')

// 无自有 Android 清单的库使用工具生成的最小清单，不增加作者维护项。
def libraryManifest = new File(libraryRoot, 'AndroidManifest.xml')
if (!libraryManifest.isFile()) {
	libraryManifest = new File(libraryRoot, 'build/gradle/AndroidManifest.xml')
	libraryManifest.parentFile.mkdirs()
	libraryManifest.setText('<manifest xmlns:android="http://schemas.android.com/apk/res/android" />\r\n', 'UTF-8')
}

android {
	compileSdk = 30
	buildToolsVersion = '36.1.0'
	defaultConfig {
		minSdk = 24
	}
	sourceSets {
		main {
			manifest.srcFile libraryManifest
			java.srcDirs = [new File(libraryRoot, 'src')]
			res.srcDirs = [new File(libraryRoot, 'res')]
			assets.srcDirs = [new File(libraryRoot, 'assets')]
			jniLibs.srcDirs = [new File(libraryRoot, 'jni')]
		}
	}
	compileOptions {
		sourceCompatibility = JavaVersion.VERSION_11
		targetCompatibility = JavaVersion.VERSION_11
	}
	buildFeatures {
		buildConfig = false
	}
}

dependencies {
	// 本地包按文件依赖处理，所需外部依赖由本库唯一配置显式补齐。
	compileOnly files(new File(sdkRoot, 'simple/SimpleAndroidRuntime.jar'))
	implementation files(gradle.ext.libraryLocalFiles)
}

// 由本库唯一的构建声明补充资源命名空间、在线依赖及确有需要的特殊选项。
apply from: new File(libraryRoot, 'library.gradle')
if (!android.namespace) {
	throw new GradleException('请在 library.gradle 中声明 android.namespace。')
}

// 同时核对直接与传递的模块依赖；旧 Support 不能作为 AndroidX 基线下的有效构建结果。
// 本地归档不声明坐标，不能据其文件名猜测类型或版本，仍须由库作者选用 AndroidX 版本。
configurations.configureEach { configuration ->
	configuration.incoming.afterResolve { dependencies ->
		def legacy = dependencies.resolutionResult.allComponents.findAll { component ->
			component.id instanceof ModuleComponentIdentifier && component.id.group == 'com.android.support'
		}.collect { it.id.displayName }.sort()
		if (legacy) {
			throw new GradleException("扩展库统一采用 AndroidX，请迁移旧 Support 依赖：${legacy.join(', ')}")
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.compilerArgs.addAll(['-Xlint:unchecked', '-Xlint:deprecation'])
}

// Android 插件在项目配置完成后创建变体任务，再取得实际编译任务的提供者。
afterEvaluate {
	def compilation = tasks.named('compileDebugJavaWithJavac', JavaCompile)

	// 导出正式 Java 编译使用的类路径；VS Code 不再自行解析第二套依赖。
	tasks.register('prepareIde') {
		group = 'build'
		description = '解析依赖并准备 VS Code 所需的类路径和源码关联。'
		dependsOn 'generateDebugRFile'
		inputs.files { compilation.get().classpath }
		doLast {
			def configuration = configurations.debugCompileClasspath
			def originalArtifacts = configuration.incoming.artifacts.artifacts
			def originals = originalArtifacts.collectEntries { artifact ->
				[(artifact.id.componentIdentifier): artifact.file]
			}
			def transformedArtifacts = configuration.incoming.artifactView {
				attributes {
					attribute(Attribute.of('artifactType', String), 'android-classes-jar')
				}
			}.artifacts.artifacts
			def origins = transformedArtifacts.collectEntries { artifact ->
				[(artifact.file.canonicalPath): artifact.id.componentIdentifier]
			}
			originals.each { component, original ->
				origins[original.canonicalPath] = component
			}

			// 源码是可选开发资料；上游未提供时保留字节码提示，不伪造或替换源码。
			def modules = originals.keySet().findAll { it instanceof ModuleComponentIdentifier }
			def sourceArtifacts = dependencies.createArtifactResolutionQuery()
				.forComponents(modules).withArtifacts(JvmLibrary, SourcesArtifact).execute()
			def sources = [:]
			sourceArtifacts.resolvedComponents.each { component ->
				def source = component.getArtifacts(SourcesArtifact).find { it instanceof ResolvedArtifactResult }
				if (source) {
					sources[component.id] = source.file
				}
			}

			def paths = (compilation.get().classpath.files + android.bootClasspath).findAll { it.isFile() }.unique()
			def libraries = paths.collect { binary ->
				def component = origins[binary.canonicalPath]
				if (!component) {
					// AGP 的编译 API JAR 使用“原名-api.jar”；只在当前解析结果中唯一匹配时关联源码。
					def base = binary.name.replaceFirst(/(?:-api)?\.jar$/, '')
					def matches = originals.findAll { id, original -> original.name.replaceFirst(/\.[^.]+$/, '') == base }
					if (matches.size() == 1) {
						component = matches.keySet().first()
					}
				}
				def original = originals[component] ?: binary
				def baseName = original.name.replaceFirst(/\.[^.]+$/, '')
				// JAR 的源码附件与原包同目录；AAR 保持独立的源码附件目录。
				def sourceName = original.name.toLowerCase(Locale.ROOT).endsWith('.aar') ?
						"sources/${baseName}-sources.jar" : "${baseName}-sources.jar"
				def localSource = new File(original.parentFile, sourceName)
				if (component instanceof ModuleComponentIdentifier) {
					localSource = new File(libraryRoot, "libs/${baseName}-sources.jar")
				}
				def source = localSource.isFile() ? localSource : sources[component]
				if (binary.canonicalFile == new File(sdkRoot, 'simple/SimpleAndroidRuntime.jar').canonicalFile) {
					// 运行库只使用 SDK 的 JAR，不提供源码包，也不探测 SDK 之外的源码仓库。
					source = null
				} else if (binary.name == 'android.jar') {
					def platformSources = new File(android.sdkDirectory, "sources/${android.compileSdkVersion}")
					def platformSourceJar = new File(android.sdkDirectory, "platforms/${android.compileSdkVersion}/android-stubs-src.jar")
					if (platformSourceJar.isFile()) {
						source = platformSourceJar
					} else if (platformSources.isDirectory()) {
						source = platformSources
					}
				}
				def repository = component instanceof ModuleComponentIdentifier
				def prepare = repository || original.name.toLowerCase(Locale.ROOT).endsWith('.aar') ||
						binary.canonicalPath.startsWith(buildDir.canonicalPath + File.separator)
				[binary: binary, source: source, prepare: prepare, repository: repository,
						identity: (component?.displayName ?: binary.canonicalPath)]
			}

			// SDK 和本地 JAR 直接引用；仓库依赖、AAR 转换结果和本库资源类统一整理。
			def ideRoot = new File(libraryRoot, 'build/ide/libs').canonicalFile
			def expected = [] as Set
			def staged = libraries.collect { library ->
				if (!library.prepare) {
					return [path: library.binary.canonicalPath, source: library.source?.canonicalPath]
				}
				def key = java.security.MessageDigest.getInstance('SHA-256')
					.digest("${library.identity}/${library.binary.name}".getBytes('UTF-8')).encodeHex().toString()
				def directory = new File(ideRoot, key)
				def binary = new File(directory, library.binary.name)
				directory.mkdirs()
				copy { from library.binary; into directory }
				expected.add(binary.canonicalPath)
				// 线上匹配源码随依赖整理，避免把个人缓存路径写入工作区；本地源码保持原引用。
				def source = library.source
				if (library.repository && source?.isFile()) {
					def stagedSource = new File(directory, binary.name.replaceFirst(/\.jar$/, '-sources.jar'))
					copy {
						from source
						into directory
						rename { stagedSource.name }
					}
					source = stagedSource
					expected.add(source.canonicalPath)
				}
				[path: binary.canonicalPath, source: source?.canonicalPath]
			}
			// 清理仅限工具拥有的 IDE JAR；移除依赖或源码关联后不能继续被通配符加载。
			fileTree(ideRoot).files.each { stale ->
				if (!stale.canonicalPath.startsWith(ideRoot.canonicalPath + File.separator)) {
					throw new GradleException("IDE 依赖路径超出生成目录：${stale}")
				}
				if (!expected.contains(stale.canonicalPath) && !stale.delete()) {
					throw new GradleException("未能清除已失效的 IDE 依赖：${stale}")
				}
			}
			// 只删除工具生成目录中已经为空的子目录，清除旧副本留下的哈希目录。
			def emptyDirectories = []
			if (ideRoot.isDirectory()) {
				ideRoot.eachDirRecurse { directory -> emptyDirectories.add(directory) }
			}
			emptyDirectories.sort { -it.absolutePath.length() }.each { directory ->
				if (!directory.canonicalPath.startsWith(ideRoot.canonicalPath + File.separator)) {
					throw new GradleException("IDE 依赖目录超出生成目录：${directory}")
				}
				if (directory.list()?.length == 0 && !directory.delete()) {
					throw new GradleException("未能清除空的 IDE 依赖目录：${directory}")
				}
			}
			def model = new File(libraryRoot, 'build/ide/classpath.json')
			model.parentFile.mkdirs()
			model.setText(JsonOutput.prettyPrint(JsonOutput.toJson([namespace: android.namespace, java: android.compileOptions.sourceCompatibility.majorVersion.toInteger(), libraries: staged])) + '\r\n', 'UTF-8')
		}
	}

	// 本库只输出自己的类，编译用 R 与第三方代码保持独立。
	def compiledClasses = tasks.register('compileLibraryClasses', Jar) {
		group = 'build'
		description = '构建扩展库，输出独立 classes.jar。'
		dependsOn compilation
		from compilation.flatMap { it.destinationDirectory }
		exclude '**/R.class', '**/R$*.class'
		archiveFileName = 'classes.jar'
		destinationDirectory = new File(libraryRoot, 'build/gradle/library')
		preserveFileTimestamps = false
		reproducibleFileOrder = true
	}

	// 交付 Gradle 原生模块元数据，保留 api/runtime、约束和排除规则，不固化本机解析结果。
	def identity = new JsonSlurper().parse(new File(libraryRoot, 'library.json'))
	if (identity.kind != 'library') {
		throw new GradleException('扩展库清单必须声明 kind 为 library。')
	}
	['Api': 'compile', 'Runtime': 'runtime'].each { suffix, scope ->
		def original = configurations.getByName("debug${suffix}Elements")
		def exported = configurations.create("es4a${suffix}Elements") {
			canBeConsumed = true
			canBeResolved = false
		}
		original.attributes.keySet().each { key ->
			exported.attributes.attribute(key, original.attributes.getAttribute(key))
		}
		original.allDependencies.each { dependency ->
			if (dependency instanceof ProjectDependency) {
				throw new GradleException('扩展库交付不接受开发工程引用，请使用仓库坐标或原始本地包。')
			}
			if (dependency instanceof ModuleDependency) exported.dependencies.add(dependency.copy())
		}
		original.allDependencyConstraints.each { constraint -> exported.dependencyConstraints.add(constraint) }
		components.es4aDependencies.addVariantsFromConfiguration(exported) { mapToMavenScope(scope) }
	}
	publishing.publications.create('es4a', MavenPublication) {
		groupId = 'es4a.extension'
		artifactId = android.namespace
		version = identity.version ?: '0.0.0'
		from components.es4aDependencies
	}

	// 独立交付目录避免覆盖作者输入；构建不生成或改写 IDE 工作区。
	tasks.register('buildLibrary') {
		group = 'build'
		description = '构建扩展库并准备可直接复制的完整交付目录。'
		dependsOn compiledClasses, 'processDebugManifest', 'generateMetadataFileForEs4aPublication'
		doLast {
			def namespace = android.namespace
			if (!(namespace ==~ /[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+/)) {
				throw new GradleException("类库命名空间无效：${namespace}")
			}
			if (android.compileSdkVersion != 'android-30' || android.defaultConfig.minSdkVersion.apiLevel != 24 ||
				android.compileOptions.sourceCompatibility != JavaVersion.VERSION_11 ||
				android.compileOptions.targetCompatibility != JavaVersion.VERSION_11) {
				throw new GradleException('ES4A 工具链固定使用编译 API 30、最低 API 24 和 Java 11。')
			}

			// 验证完整运行输入；默认仅交付声明，按需另外导出原始仓库，不复制缓存或展开结果。
			configurations.debugRuntimeClasspath.files.each { archive ->
				if (!archive.isFile() || !(archive.name.toLowerCase(Locale.ROOT) ==~ /.*\.(jar|aar)/)) {
					throw new GradleException("运行依赖必须是可读取的 JAR/AAR：${archive}")
				}
				new java.util.zip.ZipFile(archive).withCloseable { zip ->
					if (archive.name.toLowerCase(Locale.ROOT).endsWith('.aar') && !zip.getEntry('AndroidManifest.xml')) {
						throw new GradleException("AAR 缺少 AndroidManifest.xml：${archive}")
					}
				}
			}
			def localFiles = configurations.debugRuntimeClasspath.allDependencies.findAll {
				it instanceof FileCollectionDependency
			}.collectMany { it.files.files }.unique { it.canonicalPath }.sort { it.canonicalPath }
			def localEntries = [:]
			localFiles.each { dependency ->
				def lower = dependency.name.toLowerCase(Locale.ROOT)
				if (!dependency.isFile() || !(lower ==~ /.*\.(jar|aar)/) || lower.endsWith('-sources.jar')) {
					throw new GradleException("本地运行依赖必须是 JAR/AAR 原包：${dependency}")
				}
				def relative = (lower.endsWith('.aar') ? 'aars/' : 'libs/') + dependency.name
				def key = relative.toLowerCase(Locale.ROOT)
				def previous = localEntries[key]
				if (previous && !java.util.Arrays.equals(previous.source.bytes, dependency.bytes)) {
					throw new GradleException("本地交付依赖同名但内容不同：${previous.source}\n${dependency}")
				}
				localEntries[key] = [source: dependency, relative: relative]
			}

			// 输出根目录由调用者选择，目录身份仍来自本库 namespace，不能覆盖源码或开发中间目录。
			def outputRoot = providers.gradleProperty('outputRoot').isPresent() ?
				file(providers.gradleProperty('outputRoot').get()).canonicalFile : new File(libraryRoot, 'build').canonicalFile
			def target = new File(outputRoot, namespace)
			def sourcePath = libraryRoot.canonicalFile.toPath()
			def targetPath = target.canonicalFile.toPath()
			if (sourcePath.startsWith(targetPath) ||
				(targetPath.startsWith(sourcePath) && outputRoot != new File(libraryRoot, 'build').canonicalFile)) {
				throw new GradleException('交付目录不能覆盖源码目录或开发中间目录。')
			}
			def assertTree = { File directory, boolean excludeBuild = false ->
				if (directory.exists()) {
					java.nio.file.Files.walkFileTree(directory.toPath(), new java.nio.file.SimpleFileVisitor<java.nio.file.Path>() {
						@Override
						java.nio.file.FileVisitResult preVisitDirectory(java.nio.file.Path path, java.nio.file.attribute.BasicFileAttributes attributes) {
							if (excludeBuild && path.parent == directory.toPath() && path.fileName.toString() == 'build') {
								return java.nio.file.FileVisitResult.SKIP_SUBTREE
							}
							if (path.toRealPath() != path.toAbsolutePath().normalize()) {
								throw new GradleException("交付目录不能经过链接：${path}")
							}
							return java.nio.file.FileVisitResult.CONTINUE
						}

						@Override
						java.nio.file.FileVisitResult visitFile(java.nio.file.Path path, java.nio.file.attribute.BasicFileAttributes attributes) {
							if (attributes.isSymbolicLink()) {
								throw new GradleException("交付文件不能是链接：${path}")
							}
							return java.nio.file.FileVisitResult.CONTINUE
						}
					})
				}
			}
			// 工作目录与目标在同一文件系统；暂存内容在二级目录，不被 SDK 当作已安装类库。
			def workParent = new File(outputRoot, '.library-delivery')
			assertTree(workParent)
			assertTree(target)
			workParent.mkdirs()
			def lockFile = new File(workParent, namespace + '.lock')
			new RandomAccessFile(lockFile, 'rw').withCloseable { handle ->
				handle.channel.lock().withCloseable { lock ->
					def work = new File(workParent, UUID.randomUUID().toString())
					def pending = new File(work, 'new')
					def previous = new File(work, 'previous')
					pending.mkdirs()
					boolean cleanup = true
					try {
						copy {
							from compiledClasses.flatMap { it.archiveFile }
							from new File(buildDir, 'intermediates/compile_symbol_list/debug/R.txt')
							from new File(libraryRoot, 'library.json')
							into pending
						}
						copy {
							from new File(buildDir, 'intermediates/merged_manifest/debug/AndroidManifest.xml')
							into pending
						}
						copy {
							from new File(buildDir, 'publications/es4a/module.json')
							into pending
							rename { 'dependencies.module' }
						}
						if (providers.gradleProperty('includeDependencies').getOrElse('false').toBoolean()) {
							def configuration = configurations.debugRuntimeClasspath
							def artifacts = configuration.resolvedConfiguration.resolvedArtifacts
							def selected = configuration.incoming.resolutionResult.allComponents.findAll {
								it.id instanceof ModuleComponentIdentifier
							}.collect { "${it.id.group}:${it.id.module}:${it.id.version}".toString() }
							def metadataFiles = [:]
							def metadataSource = { String coordinate, String extension ->
								def key = "${coordinate}@${extension}".toString()
								if (!metadataFiles.containsKey(key)) {
									def id = coordinate.split(':')
									File metadataFile = new File(MavenRepository.directory(new File(libraryRoot, 'dependencies'), coordinate), "${id[1]}-${id[2]}.${extension}")
									if (!metadataFile.isFile()) {
										metadataFile = null
									}
									if (metadataFile == null && extension == 'pom') {
										def result = dependencies.createArtifactResolutionQuery().forModule(id[0], id[1], id[2])
											.withArtifacts(MavenModule, MavenPomArtifact).execute()
										result.resolvedComponents.each { component ->
											component.getArtifacts(MavenPomArtifact).each { artifact ->
												if (artifact instanceof ResolvedArtifactResult) {
													metadataFile = artifact.file
												}
											}
										}
									} else if (metadataFile == null) {
										def query = configurations.detachedConfiguration(dependencies.create(key))
										query.transitive = false
										def candidates = query.resolvedConfiguration.lenientConfiguration.files
										metadataFile = candidates ? candidates.first() : null
									}
									metadataFiles[key] = metadataFile
								}
								metadataFiles[key]
							} as MavenRepository.MetadataSource
							def originals = artifacts.collect { artifact ->
								new MavenRepository.Artifact(artifact.moduleVersion.id.toString(), artifact.file)
							}
							MavenRepository.export(new File(pending, 'dependencies'), originals, selected, metadataSource)
						}
						localEntries.values().each { item ->
							copy { from item.source; into new File(pending, item.relative).parentFile }
						}
						['icons', 'res', 'assets', 'jni', 'example'].each { name ->
							def input = new File(libraryRoot, name)
							assertTree(input, name == 'example')
							copy {
								from input
								into new File(pending, name)
								if (name == 'example') {
									exclude 'build', 'build/**'
								}
							}
						}
						['README.md', 'LICENSE', 'LICENSE.txt', 'NOTICE', 'NOTICE.txt'].each { name ->
							copy { from new File(libraryRoot, name); into pending }
						}
						['libs', 'aars'].each { name ->
							copy {
								from new File(libraryRoot, name)
								include '*.txt', 'LICENSE*', 'NOTICE*'
								exclude '*-sources.jar'
								into new File(pending, name)
							}
						}
						['classes.jar', 'library.json', 'AndroidManifest.xml', 'R.txt', 'dependencies.module'].each { name ->
							if (!new File(pending, name).isFile()) {
								throw new GradleException("交付文件缺失：${name}")
							}
						}
						def deliveredManifest = new XmlSlurper(false, false).parse(new File(pending, 'AndroidManifest.xml'))
						if (deliveredManifest.name() != 'manifest' || deliveredManifest.@package.text() != namespace) {
							throw new GradleException('交付清单 package 必须与 library.gradle 的 android.namespace 一致。')
						}
						assertTree(pending)

						// 全部准备成功后才替换；保留原目录以便恢复失败的移动。
						boolean hadPrevious = target.exists()
						if (hadPrevious) {
							java.nio.file.Files.move(target.toPath(), previous.toPath())
						}
						try {
							java.nio.file.Files.move(pending.toPath(), target.toPath())
						} catch (Exception failure) {
							if (hadPrevious) {
								try {
									java.nio.file.Files.move(previous.toPath(), target.toPath())
								} catch (Exception recovery) {
									cleanup = false
									throw new GradleException("交付替换失败，原文件保留在：${previous}", recovery)
								}
							}
							throw failure
						}
						new File(libraryRoot, 'build/gradle/delivery.txt').setText(target.canonicalPath, 'UTF-8')
					} finally {
						if (cleanup) {
							assertTree(work)
							delete work
						}
					}
				}
			}
		}
	}
}
